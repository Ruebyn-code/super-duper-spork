# Base44 sandbox / development environment for Opstack.
#
# Runs the app from the cloned source on a plain Node image (never the repo's
# production Dockerfile), with the checkout bind-mounted so edits are picked up
# by `node --watch`. Record data lives in ./data on the sandbox host.
name: opstack

services:
  app:
    image: node:22-bookworm-slim
    working_dir: /app
    # Dependencies are installed from the mounted lockfile, then the app starts
    # with Node's built-in watcher so source edits restart the server.
    command:
      - sh
      - -ec
      - CI=true npm ci --no-audit --no-fund && exec node --watch server.js
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - NODE_ENV=development
      # Supplied by the Base44 platform; unset outside the sandbox.
      - BASE44_PREVIEW_MODE
      # The preview proxy terminates TLS, so the app receives a plain-http
      # proxied Host header while the browser sends the public https Origin.
      # APP_ORIGIN is the app's own setting for running behind such a proxy
      # (it also drives the https Secure cookie flag). It stays empty — leaving
      # the app's normal Host-derived behaviour — unless the sandbox supplies
      # its public host suffix.
      - APP_ORIGIN=${BASE44_PUBLIC_HOST_SUFFIX:+https://3000-$BASE44_PUBLIC_HOST_SUFFIX}
    healthcheck:
      # /healthz is a read-only endpoint the app already serves.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: on-failure
    labels:
      - base44.project=Opstack
      - base44.kind=web
      - base44.port=3000

  # Phase 1 of the rebuild, running beside the current app for comparison. It
  # has no npm dependencies of its own — it requires the repo's existing
  # password, invitation and permission modules directly — so it never runs an
  # installer alongside the app service.
  rebuild:
    image: node:22-bookworm-slim
    working_dir: /app
    command:
      - node
      - --watch
      - rebuild/server.js
    ports:
      - "3001:3001"
    volumes:
      - .:/app
    environment:
      - PORT=3001
      - REBUILD_DATA_DIR=/app/rebuild/data
      - NODE_ENV=development
      # Supplied by the Base44 platform; unset outside the sandbox.
      - BASE44_PREVIEW_MODE
      # Same proxy arrangement as the app service: the preview proxy terminates
      # TLS, so the https Secure cookie flag follows the public origin.
      - REBUILD_PUBLIC_ORIGIN=${BASE44_PUBLIC_HOST_SUFFIX:+https://3001-$BASE44_PUBLIC_HOST_SUFFIX}
    healthcheck:
      # /healthz is part of the rebuild's own server.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: on-failure
    labels:
      - base44.project=Opstack rebuild
      - base44.kind=web
      - base44.port=3001
