services:
  app:
    image: node:24-bookworm-slim
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/data
      # Public preview origin used for CSRF origin checks, sign-in cookie
      # attributes and external links. Referenced from the platform variable so
      # it follows the sandbox host; override APP_ORIGIN to pin your own host.
      - APP_ORIGIN=${APP_ORIGIN:-https://3000-${BASE44_PUBLIC_HOST_SUFFIX}}
      - BASE44_PREVIEW_MODE
      - npm_config_update_notifier=false
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - opstack-data:/data
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec node --watch server.js"]
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: on-failure

volumes:
  node_modules:
  opstack-data:
