<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounts & permissions — Souvlaki Gr ordering</title><link rel="stylesheet" href="/style.css"><script src="/admin.js" defer></script><script src="/branding.js" defer></script><script src="/password.js" defer></script></head><body><header><a class="brand" href="/">Souvlaki Gr ordering</a><div class="admin-nav"><a class="header-link" href="/cart">Cart</a><details class="admin-dropdown"><summary>Administration ▾</summary><nav aria-label="Administration pages"><a href="/admin">Suppliers & stock</a><a href="/admin/accounts">Accounts & permissions</a></nav></details><a href="/">Back to ordering</a><button id="logout" type="button">Sign out</button></div></header><main class="admin-page"><p class="eyebrow">ADMINISTRATOR ACCESS</p><section class="management"><h1>Accounts & permissions</h1><p>Ordering users can browse stock and submit orders. Administrators can also manage suppliers, stock, and accounts.</p><form id="account-form"><h3 id="account-form-title">Create account</h3><label>Username<input name="username" required maxlength="80" autocomplete="off"></label><label>Password<input name="password" id="account-password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"><span id="password-help">At least 12 characters.</span></label><label>Permissions<select name="role"><option value="user">Ordering user — browse stock and place orders</option><option value="admin">Administrator — full access, including accounts</option></select></label><button id="account-save" type="submit">Create account</button><button id="account-cancel" type="button" hidden>Cancel edit</button></form><p id="account-message" role="status" aria-live="polite"></p><div id="account-list"></div></section></main></body></html>
