<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suppliers & stock — Souvlaki Gr ordering</title><link rel="stylesheet" href="/style.css"><script src="/admin.js" defer></script><script src="/branding.js" defer></script><script src="/password.js" defer></script></head><body><header><a class="brand" href="/">Souvlaki Gr ordering</a><div class="admin-nav"><a class="header-link" href="/cart">Cart</a><a href="/">Back to ordering</a><button id="logout" type="button">Sign out</button></div></header><main class="admin-page admin-layout"><aside class="admin-sidebar"><h2>Administration</h2><nav aria-label="Administration pages"><a href="/admin" aria-current="page">Suppliers & stock</a><a href="/admin/accounts">Accounts & permissions</a><a href="/admin/settings">App settings</a><a href="/email-settings">Account email settings</a></nav></aside><div class="admin-content"><p class="eyebrow">ADMINISTRATOR ACCESS</p><section class="management"><h1>Suppliers & stock</h1><p>Add suppliers, then add their stock. Changes are saved on this computer.</p><div class="management-forms"><form id="supplier-form"><h2>Add supplier</h2><label>Supplier name<input name="name" required maxlength="100" placeholder="Supplier name"></label><button type="submit">Save supplier</button></form><form id="stock-form"><h2 id="stock-form-title">Add stock</h2><label>Supplier<select name="supplierId" id="supplier-select" required></select></label><label>Stock name<input name="name" required maxlength="100"></label><label>SKU (optional)<input name="sku" maxlength="60"></label><label>Category<input name="category" maxlength="60" value="General" required></label><label>Price per unit / pack (AUD)<input name="price" type="number" min="0" max="1000000" step="0.01" placeholder="Leave blank if price is pending"></label><label>Stock photo (optional, PNG or JPG up to 2 MB)<input id="stock-photo" type="file" accept="image/png,image/jpeg"></label><img id="stock-photo-preview" class="stock-photo-preview" alt="Stock photo preview" hidden><button id="stock-photo-remove" type="button" hidden>Remove photo</button><label>Description (optional)<input name="description" maxlength="300"></label><button type="submit" id="stock-save">Save stock</button><button type="button" id="stock-cancel" hidden>Cancel edit</button></form></div><p id="manage-message" role="status" aria-live="polite"></p><div id="supplier-list"></div></section></div></main></body></html>
