<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Set up your account — Opstack</title><link rel="stylesheet" href="/style.css"><script src="/location-picker.js" defer></script><script src="/company-context.js" defer></script><script src="/edit-parts.js" defer></script><script src="/appearance-style.js" defer></script><script src="/accept-invite.js" defer></script><script src="/branding.js" defer></script><script src="/password.js" defer></script><link rel="stylesheet" href="/smooth.css"><script src="/interactions.js" defer></script><script src="/interface-text.js" defer></script><script src="/element-overrides.js" defer></script></head><body class="authentication-page"><main class="login-page"><section class="management"><a class="brand" href="/login">Opstack</a><p class="eyebrow">ACCOUNT SETUP</p><h1>Choose your password</h1><p id="invite-description">Checking your invitation…</p><form id="invite-form" hidden><label>Email<input id="invite-email" type="email" autocomplete="username" readonly></label><label>Password<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="256" aria-describedby="invite-password-help"></label><label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="256"></label><p id="invite-password-help" class="small">Use at least 12 characters.</p><button class="submit" type="submit">Set password</button></form><p id="invite-message" role="status" aria-live="polite"></p><a id="invite-sign-in" class="header-link" href="/login">Back to sign in</a></section></main></body></html>
