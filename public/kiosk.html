<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Opstack kiosk</title><script>try{if(sessionStorage.getItem("opstack-kiosk-lock-pending"))document.documentElement.classList.add("kiosk-lock-pending")}catch{}</script><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/kiosk.css"><script src="/edit-parts.js" defer></script><script src="/appearance-style.js" defer></script><script src="/kiosk.js" defer></script><script src="/clock-model.js" defer></script><script src="/shift-clock.js" defer></script><link rel="stylesheet" href="/shift-clock.css"></head><body class="kiosk-page"><header class="kiosk-header"><a href="/kiosk" aria-label="Opstack kiosk"><img src="/favicon.png" alt="Opstack"></a><div><strong id="kiosk-location" data-user-text>Opstack kiosk</strong><small id="kiosk-device-name" data-user-text></small></div><time id="kiosk-time" data-user-text></time><button id="kiosk-fullscreen" type="button" title="Full screen" aria-label="Full screen">⛶</button><button id="kiosk-lock" type="button" hidden>Done / Lock</button></header><main id="kiosk-main"><section id="kiosk-pair" class="kiosk-panel" hidden><h1>Pair this device</h1><p>Ask your location manager for a pairing link or code from Settings → Kiosk devices.</p><form id="kiosk-pair-form"><label>Network code<input id="kiosk-network" type="text" maxlength="80" autocomplete="off" placeholder="Network code"></label><label>Pairing code<input id="kiosk-pair-code" type="text" maxlength="20" autocomplete="off" placeholder="ABCD-EF12-3456" required></label><button type="submit">Pair device</button></form></section><section id="kiosk-locked" class="kiosk-panel" hidden><h1>What would you like to do?</h1><div id="kiosk-features" class="kiosk-features"></div><form id="kiosk-pin-form"><label for="kiosk-pin">Enter your staff PIN</label><input id="kiosk-pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required aria-describedby="kiosk-pin-help"><div id="kiosk-keypad" class="kiosk-keypad"></div><p id="kiosk-pin-help" class="small">Use the last four digits of your phone number.</p><button type="submit">Continue</button></form></section><section id="kiosk-work" hidden><div class="kiosk-work-heading"><strong id="kiosk-staff" data-user-text></strong><span id="kiosk-feature-name"></span><span id="kiosk-idle" class="small" role="status"></span></div><div id="kiosk-feature-body"></div></section><p id="kiosk-message" role="status" class="kiosk-message"></p></main></body></html>
